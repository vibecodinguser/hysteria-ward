name: CI

# Проверки идут на self-hosted раннере в локальной лаборатории: облачные
# раннеры аккаунту недоступны. Метка hysteria-ward-ci задаётся при регистрации
# раннера — по ней задачи и находят эту машину.
#
# Триггера pull_request здесь сознательно нет. Раннер стоит в домашней сети, а
# репозиторий публичный: работа на pull_request позволила бы любому, кто откроет
# PR, исполнить свой код на этой машине. push в main и ручной запуск требуют
# прав на запись, поэтому чужих среди запускающих не бывает.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Тесты (Go ${{ matrix.go-version }})
    runs-on: [self-hosted, hysteria-ward-ci]
    strategy:
      fail-fast: false
      matrix:
        # 1.26 — нижняя граница: её требует ядро Hysteria 2.
        # stable — проверка, что код не ломается на свежем Go.
        go-version: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Сборка
        run: go build ./...

      - name: Тесты
        run: go test ./...

  lint:
    name: Линтер
    runs-on: [self-hosted, hysteria-ward-ci]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Установить golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Линтер
        run: golangci-lint run ./...

  scripts:
    name: Скрипты
    runs-on: [self-hosted, hysteria-ward-ci]
    steps:
      - uses: actions/checkout@v4

      # Синтаксиса мало для настоящей проверки, но это быстро и не даёт
      # опечатке в установщике дойти до чистого сервера. Полная проверка —
      # прогон на чистом VPS (issue #23).
      - name: Проверить синтаксис установочных скриптов
        run: |
          found=0
          for script in packaging/*.sh; do
            [ -e "$script" ] || continue
            sh -n "$script"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "в packaging/ нет shell-скриптов"
            exit 1
          fi

  ui:
    name: Интерфейс
    runs-on: [self-hosted, hysteria-ward-ci]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Сборка интерфейса — одна команда, и её результат уезжает в бинарь.
      - name: Собрать интерфейс
        run: make ui

      # Собранный интерфейс лежит в репозитории, поэтому он может отстать от
      # исходников. git status, а не git diff: так видно и удалённые, и новые файлы
      # сборки, а не только правки в известных.
      - name: Проверить, что собранное не отстало от исходников
        run: |
          if [ -n "$(git status --porcelain -- internal/ui/dist)" ]; then
            echo "internal/ui/dist отстал от web/: выполните make ui и закоммитьте результат"
            git status --short -- internal/ui/dist
            exit 1
          fi

  build:
    name: Сборка linux/${{ matrix.goarch }}
    runs-on: [self-hosted, hysteria-ward-ci]
    strategy:
      fail-fast: false
      matrix:
        # Обе гарантированные платформы. Запускается только amd64: раннера
        # под arm64 нет, поэтому бинарь arm64 проверяется сборкой.
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Собрать
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: make build VERSION=v0.0.0-test COMMIT=deadbee

      - name: Проверить, что бинарь статический
        if: matrix.goarch == 'amd64'
        run: |
          file bin/hysteria-ward
          file bin/hysteria-ward | grep -q "statically linked"

      - name: Проверить запечённые метаданные
        if: matrix.goarch == 'amd64'
        run: |
          got="$(./bin/hysteria-ward --version)"
          want="hysteria-ward v0.0.0-test (deadbee) linux/amd64"
          if [ "$got" != "$want" ]; then
            echo "получено:  $got"
            echo "ожидалось: $want"
            exit 1
          fi
          echo "ок: $got"
