name: Release

# Релиз собирается на том же self-hosted раннере, что и CI: облачные раннеры
# аккаунту недоступны, а готовый бинарь должен быть воспроизводим из тега.
#
# Обе архитектуры собираются в одной задаче, без upload-artifact: раннер всё
# равно исполняет задачи по одной, а хранилище артефактов GitHub имеет квоту.
# Готовые файлы уходят прямо в релиз.
#
# Ассеты называются без версии: install.sh скачивает последний релиз по
# постоянному адресу и не знает тега заранее. Конкретную версию он берёт из
# каталога /releases/download/<тег>/ с теми же именами файлов.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Собрать и опубликовать
    runs-on: [self-hosted, hysteria-ward-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Проверить тег
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$VERSION" in
            v*) ;;
            *) echo "тег должен начинаться с v: $VERSION"; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Собрать linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          make build VERSION="$VERSION" COMMIT="$COMMIT"
          file bin/hysteria-ward | grep -q "statically linked"
          got="$(./bin/hysteria-ward --version)"
          echo "$got"
          case "$got" in
            *"linux/amd64") ;;
            *) echo "неожиданная платформа в --version: $got"; exit 1 ;;
          esac

          stage="dist/stage-amd64"
          mkdir -p "$stage"
          cp bin/hysteria-ward "$stage/"
          cp packaging/hysteria-ward.service "$stage/"
          cp LICENSE "$stage/"
          tar -C "$stage" -czf "dist/hysteria-ward_linux_amd64.tar.gz" \
            hysteria-ward hysteria-ward.service LICENSE
          rm -rf "$stage"

      - name: Собрать linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
        run: |
          make build VERSION="$VERSION" COMMIT="$COMMIT"
          file bin/hysteria-ward | grep -q "statically linked"
          file bin/hysteria-ward | grep -q "ARM aarch64"

          stage="dist/stage-arm64"
          mkdir -p "$stage"
          cp bin/hysteria-ward "$stage/"
          cp packaging/hysteria-ward.service "$stage/"
          cp LICENSE "$stage/"
          tar -C "$stage" -czf "dist/hysteria-ward_linux_arm64.tar.gz" \
            hysteria-ward hysteria-ward.service LICENSE
          rm -rf "$stage"

      - name: Скрипты и контрольные суммы
        run: |
          cp packaging/install.sh dist/install.sh
          if [ -f packaging/update.sh ]; then
            cp packaging/update.sh dist/update.sh
          fi
          (
            cd dist
            # checksums.txt перечисляет ровно те файлы, которые уезжают в релиз.
            # install.sh сверяет по нему скачанный архив.
            if [ -f update.sh ]; then
              sha256sum hysteria-ward_linux_*.tar.gz install.sh update.sh > checksums.txt
            else
              sha256sum hysteria-ward_linux_*.tar.gz install.sh > checksums.txt
            fi
            cat checksums.txt
          )

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
