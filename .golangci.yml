version: "2"

linters:
  settings:
    errcheck:
      # Вывод в собственные потоки (stdout и stderr) — не тот случай, где ошибку
      # записи можно осмысленно обработать: сообщить о ней уже некуда, а падать
      # из-за закрытой трубы (EPIPE) при выводе справки бессмысленно. Проверять
      # каждый Fprint на месте значило бы утопить логику в шуме.
      #
      # Всё остальное errcheck проверяет как обычно: открытие файлов, сетевые
      # вызовы, работу с хранилищем.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      # В тестах ошибки уборки (Close, Stop) на вердикт не влияют, а значимые
      # ошибки проверяются там явно через t.Fatal. Держать errcheck включённым
      # означало бы обрастать `defer func() { _ = x.Close() }()` в каждом
      # e2e-тесте и терять читаемость — а тест обязан читаться как описание
      # поведения, иначе он перестаёт быть проверкой.
      - path: _test\.go
        linters:
          - errcheck
